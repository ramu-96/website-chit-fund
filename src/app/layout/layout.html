<div class="layout" [class.collapsed]="isCollapsed" [class.isHide]="isHide">

  <!-- Sidebar -->

<app-sidebar [collapsed]="isCollapsed" class="sidebar"></app-sidebar>

<!-- OVERLAY -->
<div class="overlay" *ngIf="isHide" (click)="closeDrawer()"></div>

  <!-- Header -->
  <app-header class="header" (toggleSidebar)="toggleSidebar()"></app-header>

  <!-- Content -->
  <div class="content">
    <router-outlet></router-outlet>
  </div>

</div>
